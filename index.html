<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zona de juegos</title>
<style>
    :root { --bg:#12141f; --card:#1c2030; --text:#f1f1f5; --muted:#9aa0b4; --border:#2c3148; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
           padding: 24px 16px; background: radial-gradient(1200px 600px at 50% -10%, #23284a 0%, var(--bg) 60%);
           color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    header { text-align: center; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); letter-spacing: -.02em; }
    header p { color: var(--muted); margin-top: 8px; }
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: 100%; max-width: 760px; }
    a.option { --c: #4ecca3; display: flex; flex-direction: column; gap: 10px; padding: 28px 24px; text-decoration: none; color: inherit;
               background: var(--card); border: 2px solid var(--border); border-top: 6px solid var(--c); border-radius: 16px;
               transition: transform .15s, box-shadow .15s, border-color .15s; }
    a.option.cr { --c: #e94560; }
    a.option:hover, a.option:focus-visible { transform: translateY(-4px); border-color: var(--c); box-shadow: 0 10px 30px -10px var(--c); outline: none; }
    .emoji { font-size: 2.6rem; line-height: 1; }
    .option h2 { font-size: 1.4rem; }
    .option p { color: var(--muted); font-size: .95rem; line-height: 1.5; }
    .go { margin-top: auto; color: var(--c); font-weight: 700; }
</style>
</head>
<body>
    <header>
        <h1>🎮 Zona de juegos</h1>
        <p>Elige a qué quieres entrar</p>
    </header>
    <main class="options">
        <a class="option geo" href="/geo/">
            <span class="emoji">🗺️</span>
            <h2>GeoEspaña Master</h2>
            <p>Practica la geografía de España con mapas y preguntas.</p>
            <span class="go">Entrar →</span>
        </a>
        <a class="option cr" href="/clash/">
            <span class="emoji">⚔️</span>
            <h2>Colección de Clash Royale</h2>
            <p>Carga tus cartas y niveles con tu etiqueta de jugador y genera el resumen para pedir mazos.</p>
            <span class="go">Entrar →</span>
        </a>
    </main>
</body>
</html>
