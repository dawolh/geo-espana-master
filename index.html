<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoEspaña Master - Geografía 1º ESO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #aad3df;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .sidebar-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

    <!-- HUD Superior -->
    <nav class="h-20 glass z-[1001] flex items-center justify-between px-4 md:px-8 border-b border-slate-200">
        <div class="flex items-center gap-4">
            <div class="bg-gradient-to-br from-yellow-400 to-red-500 p-2.5 rounded-2xl shadow-lg rotate-2">
                <span class="text-2xl">🌍</span>
            </div>
            <div class="hidden sm:block">
                <h1 class="text-xl font-extrabold text-slate-800 tracking-tighter uppercase leading-none">GeoEspaña <span class="text-blue-600">Pro</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase mt-1">Geografía Física y Política</p>
            </div>
        </div>

        <div id="quiz-ui" class="hidden flex items-center gap-3 animate-in fade-in zoom-in duration-300">
            <div class="glass px-6 py-2 rounded-2xl border-2 border-blue-500 shadow-xl shadow-blue-100 flex flex-col items-center min-w-[180px]">
                <span class="text-[9px] font-bold text-blue-500 uppercase tracking-widest">Busca:</span>
                <span id="target-name" class="text-xl font-black text-slate-800 uppercase leading-none text-center">---</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex flex-col items-center glass px-4 py-1.5 rounded-xl border border-slate-200">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Puntos</span>
                <span id="score" class="text-xl font-black text-blue-600">0</span>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex relative">
        <!-- Selector de Modos Lateral -->
        <aside id="sidebar" class="sidebar-transition absolute left-4 top-4 bottom-4 w-72 z-[1000] flex flex-col gap-4 pointer-events-none">
            <div class="glass p-5 rounded-3xl pointer-events-auto flex flex-col gap-6 shadow-2xl overflow-y-auto">
                <section>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-3 block">Modo de Juego</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setMode('explorar')" id="mode-explorar" class="p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-blue-600 text-white border-blue-600">
                            <span class="text-xl">🔍</span> Explorar
                        </button>
                        <button onclick="setMode('quiz')" id="mode-quiz" class="p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-white text-slate-600 border-slate-100 hover:border-blue-200">
                            <span class="text-xl">🎯</span> Examen
                        </button>
                    </div>
                </section>

                <section>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-3 block">Categorías</label>
                    <div class="flex flex-col gap-2">
                        <button onclick="setCategory('provincias')" id="cat-provincias" class="flex items-center gap-3 p-3.5 rounded-2xl bg-blue-50 border-2 border-blue-500 transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🏛️</span>
                            <div class="text-left">
                                <p class="font-bold text-blue-900 text-sm leading-none">Provincias</p>
                                <p class="text-[9px] text-blue-500 font-bold mt-1 uppercase">Mapa Político (50+)</p>
                            </div>
                        </button>
                        <button onclick="setCategory('rios')" id="cat-rios" class="flex items-center gap-3 p-3.5 rounded-2xl bg-white border-2 border-slate-100 transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🌊</span>
                            <div class="text-left">
                                <p class="font-bold text-slate-600 text-sm leading-none">Hidrografía</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase">Principales Ríos</p>
                            </div>
                        </button>
                        <button onclick="setCategory('montanas')" id="cat-montanas" class="flex items-center gap-3 p-3.5 rounded-2xl bg-white border-2 border-slate-100 transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">⛰️</span>
                            <div class="text-left">
                                <p class="font-bold text-slate-600 text-sm leading-none">Relieve</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase">Sistemas y Picos</p>
                            </div>
                        </button>
                    </div>
                </section>

                <div class="mt-auto p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <p id="hint-box" class="text-[11px] text-blue-800 font-semibold leading-relaxed">
                        💡 Haz clic en los puntos para conocer datos sobre la geografía española.
                    </p>
                </div>
            </div>
        </aside>

        <!-- Mapa -->
        <div id="map"></div>

        <!-- Toast de Feedback -->
        <div id="toast" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-[2000] pointer-events-none transform transition-all duration-500 translate-y-20 opacity-0">
            <div id="toast-body" class="px-8 py-4 rounded-full shadow-2xl text-white font-black text-xl flex items-center gap-4 border-4 border-white">
                <span id="toast-icon" class="text-3xl"></span>
                <span id="toast-text"></span>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const geoData = {
            provincias: [

                { name: "Alicante", cap: "Alicante", com: "C. Valenciana", lat: 38.34, lng: -0.48 },

                { name: "Asturias", cap: "Oviedo", com: "Asturias", lat: 43.36, lng: -5.85 },
                { name: "Ávila", cap: "Ávila", com: "Castilla y León", lat: 40.65, lng: -4.70 },

                { name: "Burgos", cap: "Burgos", com: "Castilla y León", lat: 42.34, lng: -3.69 },
                { name: "Cáceres", cap: "Cáceres", com: "Extremadura", lat: 39.47, lng: -6.37 },
                { name: "Cádiz", cap: "Cádiz", com: "Andalucía", lat: 36.52, lng: -6.28 },
                { name: "Cantabria", cap: "Santander", com: "Cantabria", lat: 43.46, lng: -3.80 },
                { name: "Castellón", cap: "Castellón", com: "C. Valenciana", lat: 39.98, lng: -0.05 },
                { name: "Ciudad Real", cap: "Ciudad Real", com: "Castilla-La Mancha", lat: 38.98, lng: -3.92 },
                { name: "Córdoba", cap: "Córdoba", com: "Andalucía", lat: 37.88, lng: -4.77 },
                { name: "Cuenca", cap: "Cuenca", com: "Castilla-La Mancha", lat: 40.07, lng: -2.13 },
                { name: "Girona", cap: "Girona", com: "Cataluña", lat: 41.97, lng: 2.82 },
                { name: "Granada", cap: "Granada", com: "Andalucía", lat: 37.17, lng: -3.59 },
                { name: "Guadalajara", cap: "Guadalajara", com: "Castilla-La Mancha", lat: 40.63, lng: -3.16 },
                { name: "Guipúzcoa", cap: "San Sebastián", com: "País Vasco", lat: 43.31, lng: -1.98 },
                { name: "Huelva", cap: "Huelva", com: "Andalucía", lat: 37.26, lng: -6.94 },
                { name: "Huesca", cap: "Huesca", com: "Aragón", lat: 42.13, lng: -0.40 },
                { name: "Jaén", cap: "Jaén", com: "Andalucía", lat: 37.77, lng: -3.78 },
                { name: "La Rioja", cap: "Logroño", com: "La Rioja", lat: 42.46, lng: -2.44 },
                { name: "Las Palmas", cap: "Las Palmas", com: "Canarias", lat: 28.12, lng: -15.43 },

                { name: "Lleida", cap: "Lleida", com: "Cataluña", lat: 41.61, lng: 0.62 },
                { name: "Lugo", cap: "Lugo", com: "Galicia", lat: 43.01, lng: -7.55 },
                { name: "Madrid", cap: "Madrid", com: "Madrid", lat: 40.41, lng: -3.70 },
                { name: "Málaga", cap: "Málaga", com: "Andalucía", lat: 36.72, lng: -4.42 },
                { name: "Murcia", cap: "Murcia", com: "Murcia", lat: 37.99, lng: -1.13 },
                { name: "Navarra", cap: "Pamplona", com: "Navarra", lat: 42.81, lng: -1.64 },
                { name: "Ourense", cap: "Ourense", com: "Galicia", lat: 42.33, lng: -7.86 },
                { name: "Palencia", cap: "Palencia", com: "Castilla y León", lat: 42.00, lng: -4.52 },
                { name: "Pontevedra", cap: "Pontevedra", com: "Galicia", lat: 42.43, lng: -8.64 },
                { name: "Salamanca", cap: "Salamanca", com: "Castilla y León", lat: 40.97, lng: -5.66 },
                { name: "S.C. Tenerife", cap: "S.C. Tenerife", com: "Canarias", lat: 28.46, lng: -16.25 },
                { name: "Segovia", cap: "Segovia", com: "Castilla y León", lat: 40.94, lng: -4.10 },
                { name: "Sevilla", cap: "Sevilla", com: "Andalucía", lat: 37.38, lng: -5.98 },
                { name: "Soria", cap: "Soria", com: "Castilla y León", lat: 41.76, lng: -2.47 },
                { name: "Tarragona", cap: "Tarragona", com: "Cataluña", lat: 41.11, lng: 1.24 },
                { name: "Teruel", cap: "Teruel", com: "Aragón", lat: 40.34, lng: -1.10 },
                { name: "Toledo", cap: "Toledo", com: "Castilla-La Mancha", lat: 39.86, lng: -4.02 },
                { name: "Valencia", cap: "Valencia", com: "C. Valenciana", lat: 39.46, lng: -0.37 },
                { name: "Valladolid", cap: "Valladolid", com: "Castilla y León", lat: 41.65, lng: -4.72 },
                { name: "Vizcaya", cap: "Bilbao", com: "País Vasco", lat: 43.26, lng: -2.93 },
                { name: "Zamora", cap: "Zamora", com: "Castilla y León", lat: 41.50, lng: -5.74 },
                { name: "Zaragoza", cap: "Zaragoza", com: "Aragón", lat: 41.64, lng: -0.88 },
                { name: "Ceuta", cap: "Ceuta", com: "Ceuta", lat: 35.88, lng: -5.31 },
                { name: "Melilla", cap: "Melilla", com: "Melilla", lat: 35.29, lng: -2.93 }
            ],
            rios: [
                { name: "Miño", desc: "Vertiente Atlántica", coords: [[43.2, -7.5], [42.1, -8.1], [41.8, -8.8]] },
                { name: "Duero", desc: "Vertiente Atlántica", coords: [[41.9, -2.8], [41.5, -4.7], [41.1, -8.7]] },
                { name: "Tajo", desc: "Río más largo de la Península", coords: [[40.3, -1.8], [39.9, -4.0], [38.7, -9.4]] },
                { name: "Guadiana", desc: "Vertiente Atlántica", coords: [[39.0, -3.0], [38.9, -6.5], [37.2, -7.4]] },
                { name: "Guadalquivir", desc: "Vertiente Atlántica (Andalucía)", coords: [[37.9, -2.9], [37.4, -6.0], [36.7, -6.4]] },
                { name: "Ebro", desc: "Río más caudaloso de España", coords: [[43.0, -4.0], [41.6, -0.8], [40.7, 0.8]] },
                { name: "Segura", desc: "Vertiente Mediterránea", coords: [[38.1, -2.5], [38.1, -0.6]] },
                { name: "Júcar", desc: "Vertiente Mediterránea", coords: [[40.2, -1.9], [39.2, -0.2]] }
            ],
            montanas: [
                { name: "Pirineos", info: "Frontera con Francia (Aneto)", lat: 42.6, lng: 0.8 },
                { name: "Sierra Nevada", info: "Pico Mulhacén", lat: 37.05, lng: -3.3 },
                { name: "Cordillera Cantábrica", info: "Norte de España (Picos de Europa)", lat: 43.1, lng: -4.8 },
                { name: "Sistema Central", info: "Pico Almanzor", lat: 40.3, lng: -5.1 },
                { name: "Sistema Ibérico", info: "Borde oriental (Moncayo)", lat: 41.1, lng: -1.9 },
                { name: "Sierra Morena", info: "Límite sur de la Meseta", lat: 38.3, lng: -4.5 },
                { name: "Sistemas Béticos", info: "Sureste peninsular", lat: 37.5, lng: -2.5 },
                { name: "Macizo Galaico", info: "Noroeste peninsular", lat: 42.5, lng: -7.8 },
                { name: "Teide", info: "Pico más alto de España (Canarias)", lat: 28.27, lng: -16.64 }
            ]
        };

        let state = {
            mode: 'explorar',
            category: 'provincias',
            score: 0,
            currentTarget: null,
            quizPending: [], // Lista de elementos que faltan por preguntar
            layers: []
        };

        let map, baseLayer, labelsLayer;

        function init() {
            map = L.map('map', { 
                zoomControl: false, 
                attributionControl: false,
                minZoom: 5
            }).setView([40.0, -3.7], 6);
            
            baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png').addTo(map);
            labelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png').addTo(map);
            
            render();
        }

        function render() {
            state.layers.forEach(l => map.removeLayer(l));
            state.layers = [];

            const items = geoData[state.category];
            const isQuiz = state.mode === 'quiz';

            items.forEach(item => {
                let layer;
                const style = getStyle(item);

                if (state.category === 'rios') {
                    layer = L.polyline(item.coords, style);
                } else {
                    layer = L.circleMarker([item.lat, item.lng], style);
                }

                if (!isQuiz) {
                    layer.bindPopup(createPopup(item), { className: 'custom-popup' });
                } else {
                    layer.on('click', (e) => handleMapClick(item, layer));
                }

                layer.addTo(map);
                state.layers.push(layer);
            });
        }

        function getStyle(item) {
            if (state.category === 'rios') {
                return { color: '#3b82f6', weight: 5, opacity: 0.7, lineCap: 'round' };
            }
            const colors = { provincias: '#3b82f6', montanas: '#b45309' };
            return {
                radius: state.category === 'provincias' ? 9 : 13,
                fillColor: colors[state.category],
                color: '#fff',
                weight: 2,
                fillOpacity: 0.8
            };
        }

        function createPopup(item) {
            return `
                <div class="p-2">
                    <h3 class="font-black text-blue-600 text-lg uppercase leading-none mb-1">${item.name}</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Detalles:</p>
                    <div class="text-sm text-slate-700 font-medium">
                        ${item.cap ? `📍 Capital: <span class="font-bold">${item.cap}</span><br>` : ''}
                        ${item.com ? `🏛️ Comunidad: <span class="font-bold">${item.com}</span><br>` : ''}
                        ${item.info || item.desc || ''}
                    </div>
                </div>
            `;
        }

        function setMode(m) {
            state.mode = m;
            document.getElementById('mode-explorar').className = m === 'explorar' ? 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-blue-600 text-white border-blue-600' : 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-white text-slate-600 border-slate-100';
            document.getElementById('mode-quiz').className = m === 'quiz' ? 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-blue-600 text-white border-blue-600' : 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-white text-slate-600 border-slate-100';
            
            document.getElementById('quiz-ui').classList.toggle('hidden', m !== 'quiz');
            document.getElementById('hint-box').innerHTML = m === 'quiz' ? '🎯 <b>Modo Examen:</b> Busca el lugar indicado arriba. No se repetirán los aciertos.' : '💡 <b>Modo Explorar:</b> Haz clic en los puntos para conocer datos sobre España.';

            if (m === 'quiz') {
                if (map.hasLayer(labelsLayer)) map.removeLayer(labelsLayer);
                resetQuiz();
            } else {
                if (!map.hasLayer(labelsLayer)) labelsLayer.addTo(map);
            }
            render();
        }

        function setCategory(c) {
            state.category = c;
            ['provincias', 'rios', 'montanas'].forEach(id => {
                const btn = document.getElementById('cat-' + id);
                btn.className = id === c 
                    ? "flex items-center gap-3 p-3.5 rounded-2xl bg-blue-50 border-2 border-blue-500 transition-all group"
                    : "flex items-center gap-3 p-3.5 rounded-2xl bg-white border-2 border-slate-100 transition-all group";
            });
            render();
            if (state.mode === 'quiz') resetQuiz();
        }

        function resetQuiz() {
            // Copiamos todos los elementos de la categoría a la lista de pendientes
            state.quizPending = [...geoData[state.category]];
            startNextQuizItem();
        }

        function startNextQuizItem() {
            if (state.quizPending.length === 0) {
                showToast("🏆 ¡COMPLETADO!", "Has terminado la categoría", "🥇", "bg-yellow-500");
                resetQuiz();
                return;
            }
            const randomIndex = Math.floor(Math.random() * state.quizPending.length);
            state.currentTarget = state.quizPending[randomIndex];
            document.getElementById('target-name').innerText = state.currentTarget.name;
        }

        function handleMapClick(item, layer) {
            if (state.mode !== 'quiz') return;

            if (item.name === state.currentTarget.name) {
                state.score += 10;
                showToast("¡CORRECTO!", "Siguiente pregunta...", "✅", "bg-green-500");
                
                // Eliminar de la lista de pendientes para que NO se repita
                state.quizPending = state.quizPending.filter(i => i.name !== item.name);
                
                // Feedback visual momentáneo
                if (state.category === 'rios') {
                    layer.setStyle({ color: '#22c55e', weight: 8 });
                } else {
                    layer.setStyle({ fillColor: '#22c55e', radius: 16 });
                }

                setTimeout(() => {
                    render();
                    startNextQuizItem();
                }, 800);
            } else {
                showToast("UPS...", "Ese no es", "❌", "bg-red-500");
                layer.setStyle({ fillColor: '#ef4444' });
                setTimeout(() => render(), 500);
            }
            document.getElementById('score').innerText = state.score;
        }

        function showToast(title, msg, icon, color) {
            const t = document.getElementById('toast');
            const b = document.getElementById('toast-body');
            document.getElementById('toast-icon').innerText = icon;
            document.getElementById('toast-text').innerHTML = `<span class="opacity-80 text-[10px] block font-bold uppercase">${title}</span>${msg}`;
            b.className = `px-8 py-4 rounded-full shadow-2xl text-white font-black text-lg flex items-center gap-4 border-4 border-white ${color}`;
            
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 1500);
        }

        window.onload = init;
    </script>
</body>
</html>
