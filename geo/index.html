<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoEspaña Master - Geografía 1º ESO</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #aad3df;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .community-poly {
            transition: all 0.3s;
            cursor: pointer;
        }

        .sidebar-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

    <!-- HUD Superior -->
    <nav class="h-20 glass z-[1001] flex items-center justify-between px-4 md:px-8 border-b border-slate-200">
        <div class="flex items-center gap-4">
            <div class="bg-gradient-to-br from-yellow-400 to-red-500 p-2.5 rounded-2xl shadow-lg rotate-2">
                <span class="text-2xl">🌍</span>
            </div>
            <div class="hidden sm:block">
                <h1 class="text-xl font-extrabold text-slate-800 tracking-tighter uppercase leading-none">GeoEspaña <span class="text-blue-600">Master</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase mt-1">Geografía 1º ESO - Completo</p>
            </div>
        </div>

        <div id="quiz-ui" class="hidden flex items-center gap-3 animate-in fade-in zoom-in duration-300">

                <span class="text-[9px] font-bold text-blue-500 uppercase tracking-widest">Busca en el mapa:</span>
                <span id="target-name" class="text-xl font-black text-slate-800 uppercase leading-none text-center">---</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex flex-col items-center glass px-4 py-1.5 rounded-xl border border-slate-200">

        </div>

                    </div>
                </section>

                    <div class="flex flex-col gap-2">

                            <span class="text-2xl group-hover:scale-110 transition-transform">🗺️</span>
                            <div class="text-left">
                                <p class="font-bold text-blue-900 text-sm leading-none">Comunidades</p>

                            </div>
                        </button>
                        <button onclick="setCategory('capitalesCCAA')" id="cat-capitalesCCAA" class="flex items-center gap-3 p-3 rounded-2xl bg-white border-2 border-slate-100 transition-all group">

                            <div class="text-left">
                                <p class="font-bold text-slate-600 text-sm leading-none">Capitales CCAA</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase italic">Sedes de Gobierno</p>
                            </div>
                        </button>
                        <button onclick="setCategory('provincias')" id="cat-provincias" class="flex items-center gap-3 p-3 rounded-2xl bg-white border-2 border-slate-100 transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🏛️</span>
                            <div class="text-left">
                                <p class="font-bold text-slate-600 text-sm leading-none">Provincias</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase italic">50 Provincias</p>
                            </div>
                        </button>

        let mapInstance, baseLayer, labelsLayer;

        function init() {
            mapInstance = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 5 }).setView([40.0, -3.7], 6);
            baseLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16 }).addTo(mapInstance);
            labelsLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16 }).addTo(mapInstance);
            renderMap();
        }

        function renderMap() {
            mapLayers.forEach(l => mapInstance.removeLayer(l));
            mapLayers = [];
            const items = geoData[currentCategory] || [];
            const isQuiz = currentMode === 'quiz';

            items.forEach(item => {
                let layer;
                if (currentCategory === 'comunidades') {
                    layer = L.polygon(item.coords, { fillColor: item.color, color: '#475569', weight: 1.5, fillOpacity: 0.6, className: 'community-poly' });
                } else if (currentCategory === 'rios') {
                    layer = L.polyline(item.coords, { color: '#3b82f6', weight: 6, opacity: 0.7, lineCap: 'round' });
                } else {
                    const color = currentCategory === 'capitalesCCAA' ? '#2563eb' : (currentCategory === 'provincias' ? '#3b82f6' : '#b45309');
                    layer = L.circleMarker([item.lat, item.lng], { radius: 10, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 });
                }

                if (!isQuiz) layer.bindPopup(createPopupContent(item), { className: 'custom-popup' });
                else layer.on('click', () => handleQuizClick(item, layer));

                layer.addTo(mapInstance);
                mapLayers.push(layer);
            });
        }

        function createPopupContent(item) {
            return `<div class="p-2">
                <h3 class="font-black text-blue-600 text-lg uppercase leading-none mb-1">${item.name}</h3>
                <div class="text-sm text-slate-700 font-medium">
                    ${item.cap ? `📍 Capital: <b>${item.cap}</b><br>` : ''}
                    ${item.com ? `🏛️ Comunidad: <b>${item.com}</b><br>` : ''}
                    ${item.info || item.desc || ''}
                </div>
            </div>`;
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('mode-explorar').className = m === 'explorar' ? 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-blue-600 text-white border-blue-600 shadow-lg' : 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-white text-slate-600 border-slate-100 hover:border-blue-200';
            document.getElementById('mode-quiz').className = m === 'quiz' ? 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-blue-600 text-white border-blue-600 shadow-lg' : 'p-3 rounded-2xl font-bold text-sm transition-all border-2 flex flex-col items-center gap-1 bg-white text-slate-600 border-slate-100 hover:border-blue-200';
            document.getElementById('quiz-ui').classList.toggle('hidden', m !== 'quiz');
            
            if (m === 'quiz') {
                if (mapInstance.hasLayer(labelsLayer)) mapInstance.removeLayer(labelsLayer);
                startQuiz();
            } else {
                if (!mapInstance.hasLayer(labelsLayer)) labelsLayer.addTo(mapInstance);
            }
            renderMap();
        }

        function setCategory(c) {
            currentCategory = c;
            ['comunidades', 'capitalesCCAA', 'provincias', 'rios', 'montanas'].forEach(id => {
                const btn = document.getElementById('cat-' + id);
                if (btn) btn.className = id === c ? "flex items-center gap-3 p-3 rounded-2xl bg-blue-50 border-2 border-blue-500 transition-all group" : "flex items-center gap-3 p-3 rounded-2xl bg-white border-2 border-slate-100 transition-all group";
            });
            renderMap();
            if (currentMode === 'quiz') startQuiz();
        }

        function startQuiz() {
            quizPending = [...(geoData[currentCategory] || [])];
            nextQuestion();
        }

        function nextQuestion() {
            if (quizPending.length === 0) {
                showToastMessage("🏆 ¡CATEGORÍA COMPLETADA!", "¡Eres un experto!", "🥇", "bg-yellow-500");
                startQuiz();
                return;
            }
            const randomIndex = Math.floor(Math.random() * quizPending.length);
            currentTarget = quizPending[randomIndex];
            document.getElementById('target-name').innerText = currentTarget.name;
        }

        function handleQuizClick(item, layer) {
            if (currentMode !== 'quiz') return;
            if (item.name === currentTarget.name) {
                score += 15;
                showToastMessage("¡EXCELENTE!", "¡Acertaste!", "✅", "bg-green-500");
                quizPending = quizPending.filter(i => i.name !== item.name);
                layer.setStyle({ fillColor: '#22c55e', fillOpacity: 0.9 });
                setTimeout(() => { renderMap(); nextQuestion(); }, 800);
            } else {
                showToastMessage("UPS...", "Ese no es", "❌", "bg-red-500");
                layer.setStyle({ fillColor: '#ef4444' });
                setTimeout(() => renderMap(), 500);
            }
            document.getElementById('score').innerText = score;
        }

        function showToastMessage(title, msg, icon, color) {
            const t = document.getElementById('toast');
            const b = document.getElementById('toast-body');
            document.getElementById('toast-icon').innerText = icon;
            document.getElementById('toast-text').innerHTML = `<span class="opacity-80 text-[10px] block font-bold uppercase">${title}</span>${msg}`;
            b.className = `px-8 py-4 rounded-3xl shadow-2xl text-white font-black text-lg flex items-center gap-4 border-4 border-white ${color}`;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 1500);
        }

        window.onload = init;
    </script>
</body>
</html>
